<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a404a"/>
      <stop offset="1" stop-color="#23272e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc14d"/>
      <stop offset="1" stop-color="#f08a1c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9beaff"/>
      <stop offset="1" stop-color="#4cc4ea"/>
    </linearGradient>
  </defs>

  <!-- swap arrows: orange from Alt over to Win, cyan from Win under to Alt -->
  <path d="M58 40 C88 18 116 30 112 62" fill="none" stroke="#0e1014" stroke-width="13" stroke-linecap="round"/>
  <path d="M58 40 C88 18 116 30 112 62" fill="none" stroke="url(#orange)" stroke-width="8" stroke-linecap="round"/>
  <path d="M112 62 l-11 1 l7 -12 z" fill="url(#orange)" stroke="#0e1014" stroke-width="3" stroke-linejoin="round"/>

  <path d="M70 92 C40 114 12 102 16 70" fill="none" stroke="#0e1014" stroke-width="13" stroke-linecap="round"/>
  <path d="M70 92 C40 114 12 102 16 70" fill="none" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round"/>
  <path d="M16 70 l11 -1 l-7 12 z" fill="url(#cyan)" stroke="#0e1014" stroke-width="3" stroke-linejoin="round"/>

  <!-- Alt keycap, behind -->
  <g transform="rotate(-8 40 48)">
    <rect x="16" y="26" width="48" height="44" rx="11" fill="#0f1115"/>
    <rect x="16" y="22" width="48" height="44" rx="11" fill="url(#face)" stroke="#4d5561" stroke-width="2"/>
    <path d="M18 58 q0 8 8 8 l30 0" fill="none" stroke="url(#orange)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <text x="40" y="53" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="28" font-weight="800" fill="url(#orange)">A</text>
  </g>

  <!-- Win keycap, in front -->
  <g transform="rotate(8 88 86)">
    <rect x="64" y="68" width="48" height="44" rx="11" fill="#0f1115"/>
    <rect x="64" y="64" width="48" height="44" rx="11" fill="url(#face)" stroke="#4d5561" stroke-width="2"/>
    <path d="M66 96 q0 8 8 8 l18 0" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <g fill="url(#cyan)">
      <rect x="77" y="75" width="9" height="9" rx="1.6"/>
      <rect x="89" y="75" width="9" height="9" rx="1.6"/>
      <rect x="77" y="87" width="9" height="9" rx="1.6"/>
      <rect x="89" y="87" width="9" height="9" rx="1.6"/>
    </g>
  </g>
</svg>
